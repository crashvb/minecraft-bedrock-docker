[program:bedrock_server]
autorestart = true
command = /var/lib/minecraft/bedrock_server
directory=/var/lib/minecraft
startsecs = 10
stderr_logfile = /var/log/minecraft.stderr.log
stderr_logfile_maxbytes = 0
stdout_logfile = /var/log/minecraft.stdout.log
stdout_logfile_maxbytes = 0
user = minecraft

[program:tail-minecraft-stderr]
autorestart = true
command = /usr/bin/tail --follow /var/log/minecraft.stderr.log
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/stderr
stdout_logfile_maxbytes = 0

[program:tail-minecraft-stdout]
autorestart = true
command = /usr/bin/tail --follow /var/log/minecraft.stdout.log
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
